name: 今朝の号を出す

# Macを閉じていても毎朝出るよう、紙面作成〜公開をGitHub上で行う(2026-09-29〜)。
# Macの run_daily.sh(7/12/18時)は予備として残し、号が既にあれば公開だけ行う。
on:
  schedule:
    - cron: "30 21 * * *"  # 06:30 JST — 本番
    - cron: "30 22 * * *"  # 07:30 JST — 予備(GitHubの定時実行は遅れる・飛ぶことがある)
    - cron: "0 1 * * *"    # 10:00 JST — 予備
    - cron: "0 4 * * *"    # 13:00 JST — 予備
  workflow_dispatch:

concurrency:
  group: edition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 今日の号があるか確かめる
        id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          if [ -f "newsroom/editions/edition-$today.json" ]; then
            echo "$today の号は発行済みです" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "need=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN が未設定です。README の手順で Secrets に登録してください"
            exit 1
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.need == 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: steps.check.outputs.need == 'true'
        with:
          python-version: "3.12"

      - name: Claude Code と部品を入れる
        if: steps.check.outputs.need == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install markdown nh3

      - name: 紙面を書く
        if: steps.check.outputs.need == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash newsroom/write_edition.sh

      - name: サイトを作って公開する
        if: steps.check.outputs.need == 'true'
        run: |
          python build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs newsroom/editions newsroom/featured_urls.txt
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "今朝の号: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
          echo "公開しました: https://sho3690.github.io/ai-news-pages/" | tee -a "$GITHUB_STEP_SUMMARY"
